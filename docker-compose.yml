services:
  client:
    image: node:22-alpine
    working_dir: /srv
    restart: unless-stopped
    command: sh -c "apk add --no-cache curl && curl -sL https://github.com/rjarem/netspace/archive/edd9fcc0431430f047681dabcc30fac04ce5d19c.tar.gz | tar xz --strip-components=1 && npm install -g serve && cp -r packages/client/dist /srv/dist && serve -s /srv/dist -l 80"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.netspace-client.rule=Host(`play.turedvirtual.vip`)"
      - "traefik.http.routers.netspace-client.entrypoints=websecure"
      - "traefik.http.routers.netspace-client.tls.certresolver=letsencrypt"
      - "traefik.http.services.netspace-client.loadbalancer.server.port=80"

  world:
    image: node:22-alpine
    working_dir: /srv
    restart: unless-stopped
    environment:
      - PORT=2567
      - DEV_NO_AUTH=1
      - JWT_SECRET=netspace-dev-secret-change-me
      - ADMIN_TOKEN=netspace-admin-dev
      - LIVEKIT_HOST=wss://livekit.turedvirtual.vip
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=devsecret-change-me
    command: sh -c "apk add --no-cache curl python3 make g++ && curl -sL https://github.com/rjarem/netspace/archive/edd9fcc0431430f047681dabcc30fac04ce5d19c.tar.gz | tar xz --strip-components=1 && npm install -g pnpm@12 && pnpm install --frozen-lockfile --ignore-scripts --filter @netspace/shared --filter @netspace/server && cd packages/server && node dist/index.js"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.netspace-world.rule=Host(`api.turedvirtual.vip`)"
      - "traefik.http.routers.netspace-world.entrypoints=websecure"
      - "traefik.http.routers.netspace-world.tls.certresolver=letsencrypt"
      - "traefik.http.services.netspace-world.loadbalancer.server.port=2567"

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - LIVEKIT_BIND_ADDRESSES=0.0.0.0
      - LIVEKIT_RTC_TCP_PORT=7881
      - LIVEKIT_RTC_PORT_RANGE_START=50000
      - LIVEKIT_RTC_PORT_RANGE_END=60000
      - 'LIVEKIT_KEYS=devkey: devsecret-change-me'
    command: --dev

      - "traefik.enable=true"
      - "traefik.http.routers.netspace-client.rule=Host(`play.turedvirtual.vip`)"
      - "traefik.http.routers.netspace-client.entrypoints=websecure"
      - "traefik.http.routers.netspace-client.tls.certresolver=letsencrypt"
      - "traefik.http.services.netspace-client.loadbalancer.server.port=80"

networks:
  dokploy-network:
    external: true
